<style>
:root{--navy:#0F5C8C;--navy2:#1778B5;--orange:#F28C28;--sky:#2E9BD6;--sky2:#8DC9EE;--bg:#EAF4FB;--card:#fff;--ink:#14213D;--mut:#667085;--line:#D8E1EB;--ok:#22A06B;--warn:#F2A93B;--bad:#E5484D;--vio:#8E4EC6}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.hdr{margin:14px 22px 0;border-top:6px solid var(--orange);border-radius:18px 18px 0 0;color:#fff;padding:20px 28px 18px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 46px),linear-gradient(110deg,#1B86C8 0%,#3FA9E3 55%,#6CC3EF 100%)}
.hdr .bar{width:5px;align-self:stretch;min-height:92px;background:var(--orange);border-radius:3px}
.hdr .ico{width:78px;height:78px;border-radius:18px;background:#E28A42;display:flex;align-items:center;justify-content:center;flex:none}
.hdr .ico img{width:42px;height:auto}
.hdr .tx{min-width:260px;flex:1}
.hdr .eyebrow{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:2.2px;color:#fff;text-transform:uppercase}
.hdr .eyebrow i{font-style:normal;color:#CDEBFA;margin:0 10px}.hdr .eyebrow span{color:#E6F5FD}
.hdr h1{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:700;font-size:44px;line-height:1.05;margin:4px 0 6px;letter-spacing:.5px;text-transform:uppercase;padding-bottom:8px;position:relative}
.hdr h1:after{content:"";position:absolute;left:0;bottom:0;width:92px;height:3px;background:var(--orange)}
.hdr .lead{color:#F2FAFE;font-size:15px;margin-top:6px}
.hdr .logos{display:flex;align-items:center;gap:18px;margin-left:auto;background:#fff;border-radius:16px;padding:10px 20px;box-shadow:0 4px 14px rgba(8,60,100,.22)}
.hdr .logos .esc{height:38px;width:auto}
.hdr .logos .vs{width:1px;height:62px;background:#C9DDEB}
.hdr .logos .spe{height:62px;width:auto}
.hdr .logos .spt{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11.5px;letter-spacing:1.2px;color:#2C5F86;line-height:1.35;text-transform:uppercase;max-width:120px}
@media(max-width:760px){.hdr{padding:12px 14px;margin:8px 8px 0;gap:10px}.hdr h1{font-size:24px;margin:2px 0 4px;padding-bottom:6px}.hdr .lead,.hdr .eyebrow span,.hdr .spt{display:none}.hdr .eyebrow{font-size:11px;letter-spacing:1.4px}.hdr .ico{width:48px;height:48px;border-radius:12px}.hdr .ico img{width:26px}.hdr .tx{min-width:0}.hdr .logos{margin-left:0;padding:6px 12px;gap:10px;width:100%;justify-content:center}.hdr .logos .esc{height:26px}.hdr .logos .spe{height:40px}.hdr .logos .vs{height:40px}.hdr .bar{display:none}}
nav{background:var(--navy2);display:flex;gap:4px;padding:6px 18px 0;margin:0 22px;border-radius:0 0 14px 14px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#E3F3FC;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0}
nav button.on{background:var(--bg);color:var(--navy)}
nav button:hover:not(.on){color:#fff}
main{padding:18px 22px;max-width:1500px;margin:0 auto}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 10px 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,37,69,.05)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:var(--mut);gap:3px;text-transform:uppercase;letter-spacing:.3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--sky);border-color:var(--sky)}
input[type=number]{width:90px}input[type=time]{width:105px}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:700;font-size:13px;color:#fff;cursor:pointer;background:var(--sky)}
.btn:hover{filter:brightness(1.08)}.btn.ok{background:var(--ok)}.btn.or{background:var(--orange)}.btn.bad{background:var(--bad)}.btn.vio{background:var(--vio)}.btn.nv{background:var(--navy2)}.btn.ghost{background:#E7EEF6;color:var(--navy)}.btn.sm{padding:4px 9px;font-size:12px}
table{border-collapse:collapse;width:100%}
th{background:#E7EEF6;color:var(--navy);font-size:11px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:7px 6px;position:sticky;top:0;white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid #EDF1F6;vertical-align:middle}
td input,td select{width:100%;padding:5px 6px}
td input[type=number]{width:84px}td input[type=time]{width:122px}
tr.conf td{background:#FFF4E5}tr.val td{background:#EAF8F1}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:700;font-size:13px;display:flex;gap:7px;align-items:center}
.chip.sel{border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sumbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.sum{background:#F4F8FC;border-radius:10px;padding:8px 12px;min-width:110px}
.sum small{display:block;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase}.sum b{font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-radius:12px;padding:12px 14px;color:#fff}
.kpi small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.92}.kpi b{font-size:30px;line-height:1.15}.kpi span{font-size:12px;opacity:.95;display:block}
.banner{background:#FFF4E5;border:1px solid #F7C98B;color:#8A4B00;border-radius:10px;padding:9px 14px;margin-bottom:12px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.red{background:#FDECEC;border-color:#F3B1B3;color:#9B1C20}
.mut{color:var(--mut)}.r{text-align:right}.c{text-align:center}
.msg{background:#F4F8FC;border-left:5px solid var(--sky);padding:10px 14px;border-radius:8px;line-height:1.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sub2{display:flex;gap:6px;margin-bottom:10px}
.sub2 button{border:0;background:#E7EEF6;color:var(--navy);padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.sub2 button.on{background:var(--navy2);color:#fff}
svg text{font-family:inherit}
.scroll{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:10px}

.sec{padding:0}.sech{display:flex;gap:10px;align-items:center;padding:14px 16px;cursor:pointer}.sech b{color:var(--navy);font-size:15px;white-space:nowrap}.sech .mut{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.chev{color:var(--navy);font-size:16px}
.sec.done:not(.open) .sech b:after{content:' ✔';color:var(--ok)}.sec.open{border-color:var(--sky);box-shadow:0 0 0 3px rgba(46,155,214,.15)}.secb{padding:0 16px 16px}
.combo{position:relative;max-width:560px}.combo input{width:100%;font-size:16px;padding:13px 42px 13px 12px;border-radius:10px}
.cbtn{position:absolute;right:4px;top:4px;bottom:4px;width:38px;border:0;background:transparent;font-size:18px;color:var(--navy);cursor:pointer}
.clist{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(11,37,69,.18);max-height:330px;overflow:auto}
.citem{display:flex;gap:8px;align-items:center;padding:12px;cursor:pointer;border-bottom:1px solid #EDF1F6}.citem.hi,.citem:hover{background:#EAF4FB}.cst{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.bigbtn{width:100%;padding:13px;font-size:15px;border-radius:12px;margin-top:14px}
.ti{width:84px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:15px}
textarea.det{width:100%;min-width:230px;resize:vertical;line-height:1.35}
.tw{overflow-x:auto}.gscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
@media(max-width:720px){
 main{padding:10px 8px}nav{margin:0 8px;padding:6px 6px 0;gap:2px}nav button{padding:9px 9px;font-size:12.5px}
 input,select,textarea{font-size:16px}.card{padding:12px}.sech{padding:13px 12px}.secb{padding:0 12px 14px}
 .tc thead{display:none}.tc,.tc tbody,.tc tr,.tc td{display:block;width:100%}
 .tc tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:#FBFDFF}
 .tc td{display:flex;align-items:center;gap:8px;border:0;padding:4px 0;min-width:0!important}
 .tc td:before{content:attr(data-label);flex:0 0 70px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}
 .tc td[data-label=""]:before{display:none}
 .tc td input,.tc td select,.tc td textarea{flex:1;width:auto!important;min-width:0;padding:9px}
 .tc td .ti{flex:0 0 100px}
 .sum{min-width:90px;padding:6px 9px}.sum b{font-size:16px}
 .kpi b{font-size:24px}
}
@media print{header,nav,footer,.noprint{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;break-inside:avoid}@page{size:A4 landscape;margin:10mm}}
</style>
</head>

function calc(rec,turno){
  const opera = rec.estado==='OPERA';
  const base = rec.carga!=null&&rec.carga!==''?(+rec.carga||0):(+DB.cfg.carga[turno]||0);
  const a = {carga:opera?base:0,prod:0,golpes:0,golpesStd:0,teor:0,malas:0,sinStd:0,par:{},pt:0,causas:{}};
  for(const p of rec.prod){const m=+p.min||0,g=+p.golpes||0;a.prod+=m;a.golpes+=g;a.malas+=(+p.malas||0);
    if(+p.std>0){a.teor+=m*p.std/60;a.golpesStd+=g;}else a.sinStd+=m;}
  for(const q of rec.paradas){const m=+q.min||0;if(q.cat==='DESP'){a.carga=Math.max(0,a.carga-m);continue;}a.par[q.cat]=(a.par[q.cat]||0)+m;a.pt+=m;
    const k=q.cat+'|'+(q.causa||'Sin detallar');a.causas[k]=(a.causas[k]||0)+m;}
  return a;
}
function addAgg(t,a){
  for(const k of ['carga','prod','golpes','golpesStd','teor','malas','sinStd','pt'])t[k]=(t[k]||0)+a[k];
  t.par=t.par||{};t.causas=t.causas||{};
  for(const k in a.par)t.par[k]=(t.par[k]||0)+a.par[k];
  for(const k in a.causas)t.causas[k]=(t.causas[k]||0)+a.causas[k];
  return t;
}
function metrics(a){
  const disp=a.carga>0?a.prod/a.carga:null;
  const rend=a.teor>0?a.golpesStd/a.teor:null;
  const cal=a.golpes>0?(a.golpes-a.malas)/a.golpes:null;
  const oa=disp!=null&&rend!=null?disp*rend:null;
  const oee=oa!=null&&cal!=null?oa*cal:null;
  return {disp,rend,cal,oa,oee,sinReg:Math.max(0,a.carga-a.prod-a.pt)};
}
function recsWhere(f){const out=[];for(const k in DB.records){const [fecha,turno,maq]=k.split('|');if(f(fecha,turno,maq))out.push({fecha,turno,maq,rec:DB.records[k]});}return out;}

const W=560;
function axisTicks(max,n=4){const step=Math.pow(10,Math.floor(Math.log10(max/n||1)));let s=step;for(const m of [1,2,2.5,5,10]){if(max/(step*m)<=n){s=step*m;break;}}const t=[];for(let v=0;v<=max+s*0.01;v+=s)t.push(v);return t;}
function svgBars(labels,series,{h=300,unit=''}={}){
  const L=54,R=12,T=18,B=64,iw=W-L-R,ih=h-T-B;
  const max=Math.max(1,...series.flatMap(s=>s.vals.map(v=>v||0)));const ticks=axisTicks(max*1.1);const ymax=ticks[ticks.length-1];
  const gw=iw/Math.max(1,labels.length),bw=Math.min(34,gw/(series.length+0.6));
  let g=ticks.map(v=>{const y=T+ih-v/ymax*ih;return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E3EAF2"/><text x="${L-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#667085">${nf(v)}</text>`;}).join('');
  labels.forEach((lb,i)=>{const cx=L+gw*i+gw/2;
    series.forEach((s,j)=>{const v=s.vals[i]||0,bh=v/ymax*ih,x=cx-(series.length*bw)/2+j*bw,y=T+ih-bh;
      g+=`<rect x="${x}" y="${y}" width="${bw-2}" height="${bh}" rx="3" fill="${Array.isArray(s.color)?s.color[i]:s.color}"/>`;

function cerrarTurno(){const T=DB.turnos[UI.fecha+'|'+UI.turno],blk=[],warn=[],miss=[];

  for(const m of DB.machines){const r=DB.records[key(UI.fecha,UI.turno,m.id)];
    if(!r){if(m.estado==='OPERA')miss.push(m.nombre);continue;}
    if(r.estado!=='OPERA')continue;const a=calc(r,UI.turno);
    if(!r.prod.length&&!r.paradas.length)warn.push(m.nombre+': sin producción ni paradas.');
    else if(a.carga-a.prod-a.pt>30)warn.push(m.nombre+': faltan '+nf(a.carga-a.prod-a.pt)+' min por explicar.');
    if(r.prod.some(p=>!(+p.min>0)))warn.push(m.nombre+': hay tramos sin minutos.');}
  if(blk.length){info('<b>Antes de cerrar el turno:</b><ul style="padding-left:18px;margin:8px 0 0">'+blk.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>');return;}
  const fin=()=>{for(const m of DB.machines){if(m.estado==='OPERA'&&!DB.records[key(UI.fecha,UI.turno,m.id)])getRec(UI.fecha,UI.turno,m.id).estado='NOPROG';}T.cerrado=true;save();render();info('Turno cerrado ✔');};
  if(!miss.length&&!warn.length){fin();return;}
  modal('<b>Se puede cerrar igual</b>'+(miss.length?`<p style="margin:8px 0 0">Sin carga (se marcan <b>No programadas</b>): ${miss.map(esc).join(', ')}.</p>`:'')+(warn.length?'<p style="margin:8px 0 0">Para revisar:</p><ul style="padding-left:18px;margin:4px 0 0">'+warn.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul>':''),[['Volver a revisar','ghost',null],['Cerrar turno igual','ok',fin]]);}

/* ---------- PLANIFICACIÓN (Gantt de trabajo, cambios de modelo y paradas) ---------- */
const MODCOL=['#2E9BD6','#22A06B','#8E4EC6','#F28C28','#0F5C8C','#E5484D','#14B8A6','#B45309','#6366F1','#84CC16'];
const shiftDay=(f,d)=>{const x=new Date(f+'T12:00:00');x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);};
function modeloDe(p){if(!p.stdId)return 'Fuera de maestro';const s=DB.standards.find(x=>x.id===p.stdId);return s&&s.modelo?s.modelo:'Sin modelo';}
function ganttBuild(rec,turno){
  const [w0,w1]=DB.cfg.horario[turno].map(toMin);
  const all=[];
  rec.prod.forEach(p=>all.push({k:'prod',s:toMin(p.ini),e:toMin(p.fin),mn:+p.min||0,modelo:modeloDe(p),pieza:p.pieza||'',cod:p.codigo||'',golpes:+p.golpes||0}));
  rec.paradas.forEach(q=>all.push({k:'par',s:toMin(q.ini),e:toMin(q.fin),mn:+q.min||0,cat:q.cat,causa:q.causa||'',obs:q.obs||''}));
  const placed=[],pend=[];
  for(const it of all){if(it.s!=null){if(it.e==null||it.e<=it.s)it.e=it.s+Math.max(it.mn,1);placed.push(it);}else if(it.mn>0)pend.push(it);}
  // espacios libres del turno (sin items con hora)
  let free=[[w0,w1]];
  for(const it of placed.slice().sort((a,b)=>a.s-b.s)){const nf2=[];for(const [a,b] of free){if(it.e<=a||it.s>=b){nf2.push([a,b]);continue;}if(it.s>a)nf2.push([a,it.s]);if(it.e<b)nf2.push([it.e,b]);}free=nf2;}
  // los items sin hora se acomodan en los huecos, en orden (posición estimada)
  const est=[];
  for(const it of pend){let need=it.mn;while(need>0&&free.length){const f=free[0],seg=Math.min(need,f[1]-f[0]);est.push({...it,s:f[0],e:f[0]+seg,est:true});f[0]+=seg;need-=seg;if(f[1]-f[0]<=0)free.shift();}}
  const bars=[...placed,...est];
  const baches=free.filter(f=>f[1]-f[0]>=5).map(f=>({s:f[0],e:f[1],mn:f[1]-f[0]}));
  const prod=bars.filter(b=>b.k==='prod').sort((a,b)=>a.s-b.s),cambios=[];
  for(let i=1;i<prod.length;i++)if(prod[i].modelo!==prod[i-1].modelo)cambios.push({t:prod[i].s,de:prod[i-1].modelo,a:prod[i].modelo,pieza:prod[i].pieza});
  const sum=k=>bars.filter(b=>b.k===k).reduce((s,b)=>s+(b.e-b.s),0);
  return {w0,w1,bars,baches,cambios,prod:sum('prod'),par:sum('par'),bache:baches.reduce((s,b)=>s+b.mn,0)};
}

/* ---------- DEMO (simulado, determinístico) ---------- */
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function loadDemo(){
  const days=['2026-11-02','2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-09','2026-11-10','2026-11-11','2026-11-12'];
  const R=rng(20261113);
  days.forEach(d=>TURNOS.forEach(t=>{
    DB.turnos[d+'|'+t]={sup:{leg:'DEMO',nom:'Supervisor demo'},cerrado:true,demo:true};
    DB.machines.forEach(m=>{
      const k=key(d,t,m.id);if(DB.records[k])return;
      if(m.estado==='FS'){DB.records[k]={estado:'FS',prod:[],paradas:[],demo:true};return;}
      const opts=stdOptions(m);if(!opts.length)return;
      const rec={estado:'OPERA',prod:[],paradas:[],demo:true};const ini=toMin(DB.cfg.horario[t][0])+15;let cur=ini;const carga=DB.cfg.carga[t];
      const stops=[];
      if(R()<.55)stops.push(['SETUP',DB.causes.SETUP[Math.floor(R()*3)],15+Math.floor(R()*5)*10]);
      if(R()<.25)stops.push(['MANT',DB.causes.MANT[Math.floor(R()*DB.causes.MANT.length)],20+Math.floor(R()*10)*10]);
      if(R()<.18)stops.push(['FOP',DB.causes.FOP[0],60+Math.floor(R()*4)*30]);
      if(R()<.22)stops.push(['ESP',DB.causes.ESP[Math.floor(R()*DB.causes.ESP.length)],15+Math.floor(R()*4)*15]);
      if(R()<.08)stops.push(['MATR',DB.causes.MATR[Math.floor(R()*3)],30+Math.floor(R()*3)*20]);
      const pt=stops.reduce((s,x)=>s+x[2],0);let left=Math.max(60,carga-pt-Math.floor(R()*12));
      const np=left>260?2:1;const hh=x=>String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
      for(let i=0;i<np;i++){const s=opts[Math.floor(R()*opts.length)];const mn=i===np-1?left:Math.round(left/np);left-=mn;
        const eff=.72+R()*.28;rec.prod.push({stdId:s.id,pieza:s.comp,codigo:s.codigo,op:s.op,std:s.std,manual:false,ini:hh(cur),fin:hh(cur+mn),min:mn,golpes:Math.round(mn*s.std/60*eff),malas:Math.round(R()<.3?R()*14:0),obs:''});cur+=mn;}
      stops.forEach(x=>{rec.paradas.push({cat:x[0],causa:x[1],ini:'',fin:'',min:x[2],obs:''});});
      DB.records[k]=rec;});}));
  DB.demoLoaded=true;
}

  const r=await fetch(API_URL+path,{method:method||'GET',headers:{'content-type':'application/json','x-clave':CLAVE||'','x-email':encodeURIComponent(EMAIL||'')},body:body===undefined?undefined:JSON.stringify(body)});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error((j&&j.error)||('HTTP '+r.status));er.status=r.status;throw er;}return j;}
const m2id=std=>{const m=DB.machines.find(x=>x.std===std);return m?m.id:null;};
function mapBoot(b){
  const id2std={};
  DB.machines=b.maquinas.map(m=>{id2std[m.id]=m.codigo_std;return{id:m.id,nombre:m.nombre,std:m.codigo_std,estado:m.estado_default,nota:m.nota||''};});
  DB.cats=b.categorias.map(c=>{const o=SEED_CATS.find(x=>x.id===c.id);return{id:c.id,name:c.nombre,color:o?o.color:'#7B8794'};});
  DB.causes={};b.categorias.forEach(c=>DB.causes[c.id]=[]);b.causas.forEach(x=>(DB.causes[x.categoria_id]=DB.causes[x.categoria_id]||[]).push(x.nombre));
  DB.standards=b.estandares.map(e=>({id:String(e.id),modelo:(e.modelos||[]).join(' / '),codigo:e.codigo,op:e.op,maq:id2std[e.maquina_id],comp:e.comp||'',opn:e.opn||'',ppu:null,fecha:null,validado:!!e.validado,stdAlt:e.std_alt==null?null:+e.std_alt,std:+e.std,estado:e.estado,src:e.fuente}));
  if(b.config&&b.config.cfg)DB.cfg=Object.assign(fresh().cfg,b.config.cfg);
}
function mapRegs(r){
  const sd=id=>DB.standards.find(x=>x.id===String(id))||{};
  DB.records={};DB.turnos={};
  for(const x of r.registros){
    DB.records[key(x.fecha,x.turno,x.maquina_id)]={estado:x.estado,...(x.carga_min!=null?{carga:+x.carga_min}:{}),
      prod:x.tramos.map(t=>{const s=t.estandar_id?sd(t.estandar_id):{};return{stdId:t.estandar_id?String(t.estandar_id):'',pieza:t.pieza_manual||s.comp||'',codigo:t.codigo_manual||s.codigo||'',op:t.op_manual||s.op||'',std:+t.std_snapshot,manual:!t.estandar_id&&!!t.pieza_manual,ini:t.hora_ini||'',fin:t.hora_fin||'',min:+t.minutos,golpes:+t.golpes,malas:+t.piezas_scrap,obs:t.obs||''};}),
      paradas:x.paradas.map(q=>({cat:q.categoria_id,causa:q.causa||'',ini:q.hora_ini||'',fin:q.hora_fin||'',min:+q.minutos,obs:q.nota||''}))};}
  for(const t of r.turnos)DB.turnos[t.fecha+'|'+t.turno]={sup:{leg:t.sup_leg||'',nom:t.sup_nom||''},cerrado:!!t.cerrado};
}
const J=o=>JSON.stringify(o);
function snapAll(){SNAP={recs:{},turnos:{},stds:{},maqs:{},causes:{},cfg:J(DB.cfg)};
  for(const k in DB.records)SNAP.recs[k]=J(DB.records[k]);for(const k in DB.turnos)SNAP.turnos[k]=J(DB.turnos[k]);
  for(const x of DB.standards)SNAP.stds[x.id]=J(x);for(const m of DB.machines)SNAP.maqs[m.id]=J(m);
  for(const c in DB.causes)SNAP.causes[c]=J(DB.causes[c]);}
function stdBody(s){return{std:+s.std||0,std_alt:s.stdAlt==null?null:+s.stdAlt,validado:!!s.validado,estado:s.estado,maquina_id:m2id(s.maq),codigo:s.codigo,op:s.op,comp:s.comp,opn:s.opn,modelo:s.modelo};}
function recBody(k,r){const [fecha,turno,maquina_id]=k.split('|');
  return{fecha,turno,maquina_id,estado:r.estado,carga_min:(r.carga==null||r.carga==='')?null:+r.carga,
    tramos:r.prod.map(p=>{const sid=/^\d+$/.test(String(p.stdId||''))?+p.stdId:null;return{estandar_id:sid,std_snapshot:+p.std||0,minutos:+p.min||0,golpes:+p.golpes||0,piezas_scrap:+p.malas||0,hora_ini:p.ini||null,hora_fin:p.fin||null,obs:p.obs||null,pieza_manual:sid?null:(p.pieza||null),codigo_manual:sid?null:(p.codigo||null),op_manual:sid?null:(p.op||null)};}),
    paradas:r.paradas.map(q=>({categoria_id:q.cat,causa:q.causa||null,minutos:+q.min||0,nota:q.obs||null,hora_ini:q.ini||null,hora_fin:q.fin||null}))};}
function schedSync(){clearTimeout(syncT);syncT=setTimeout(()=>{syncT=null;runSync();},1200);syncErr='';showSt();
  window.onbeforeunload=()=>'Hay cambios sin guardar';}
function syncNow(){clearTimeout(syncT);syncT=null;runSync();}
async function runSync(){
  if(!SNAP)return;if(syncBusy){syncAgain=true;return;}syncBusy=true;syncErr='';showSt();
  const ing=ROL==='ing';
  try{
    if(ing){
      if(J(DB.cfg)!==SNAP.cfg){await api('/config/cfg','PUT',DB.cfg);SNAP.cfg=J(DB.cfg);}
      for(const c in DB.causes){const sj=J(DB.causes[c]);if(sj!==SNAP.causes[c]){await api('/causas/sync','PUT',{categoria_id:c,nombres:DB.causes[c]});SNAP.causes[c]=sj;}}
      for(const m of DB.machines){const sj=J(m);if(sj!==SNAP.maqs[m.id]){await api('/maquinas/'+m.id,'PUT',{nombre:m.nombre,codigo_std:m.std,estado_default:m.estado,nota:m.nota});SNAP.maqs[m.id]=sj;}}
      for(const id in SNAP.stds){if(!DB.standards.some(x=>x.id===id)&&/^\d+$/.test(id)){await api('/estandares/'+id,'DELETE');delete SNAP.stds[id];}}
      for(const s of DB.standards.slice()){
        if(s.id[0]==='N'){if(!(s.codigo&&s.op&&+s.std>0&&m2id(s.maq)))continue;
          const r=await api('/estandares','POST',stdBody(s));const nid=String(r.id);
          for(const k in DB.records)for(const p of DB.records[k].prod)if(p.stdId===s.id)p.stdId=nid;
          s.id=nid;SNAP.stds[nid]=J(s);continue;}
        const sj=J(s);if(sj!==SNAP.stds[s.id]){await api('/estandares/'+s.id,'PUT',stdBody(s));SNAP.stds[s.id]=sj;}}
    }
    for(const k in DB.turnos){const sj=J(DB.turnos[k]);if(sj!==SNAP.turnos[k]){const [fecha,turno]=k.split('|'),t=DB.turnos[k];
      await api('/turnos','PUT',{fecha,turno,sup_leg:t.sup.leg,sup_nom:t.sup.nom,cerrado:!!t.cerrado});SNAP.turnos[k]=sj;}}
    for(const k in DB.records){const r=DB.records[k],sj=J(r);if(sj===SNAP.recs[k])continue;
      const mm=mach(k.split('|')[2]);
      if(SNAP.recs[k]===undefined&&!r.prod.length&&!r.paradas.length&&mm&&r.estado===mm.estado){SNAP.recs[k]=sj;continue;}
      await api('/registros','PUT',recBody(k,r));SNAP.recs[k]=sj;}
  }catch(e){syncErr=e.message;if(e.status===401){localStorage.removeItem('pdc.clave');showLogin('La clave ya no es válida.');}
    if(e.status===403)syncErr='Tu clave no permite modificar eso (solo Ingeniería).';
    setTimeout(()=>{if(syncErr&&!syncBusy)runSync();},15000);}
  syncBusy=false;showSt();
  if(syncAgain){syncAgain=false;schedSync();}
  else if(!syncErr&&!syncT)window.onbeforeunload=null;
}
function showLogin(msg){let o=document.getElementById('login');if(o)o.remove();o=document.createElement('div');o.id='login';
  o.style.cssText='position:fixed;inset:0;background:linear-gradient(135deg,#0B2545,#1F6FA8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px';
  o.innerHTML=`<div class="card" style="max-width:380px;width:100%;margin:0"><h3 style="margin-top:0">Planillas de Control · UET 5</h3>
   <p class="mut">Ingresá con tu email de Escorial y la clave de acceso.</p>
   <input id="eml" type="email" placeholder="usuario@escorial.com.ar" value="${esc(EMAIL||'')}" style="width:100%;margin-bottom:8px" onkeydown="if(event.key==='Enter')$('#clv').focus()">
   <input id="clv" type="password" placeholder="Clave" style="width:100%;margin-bottom:10px" onkeydown="if(event.key==='Enter')doLogin()">
   <div id="lgm" style="color:#C0392B;font-size:13px;min-height:18px">${esc(msg||'')}</div>
   <button class="btn nv" style="width:100%" onclick="doLogin()">Ingresar</button></div>`;
  document.body.appendChild(o);setTimeout(()=>{const i=$(EMAIL?'#clv':'#eml');if(i)i.focus();},50);}
async function doLogin(){const v=$('#clv').value.trim(),em=$('#eml').value.trim().toLowerCase();if(!v||!em)return;CLAVE=v;EMAIL=em;$('#lgm').textContent='Verificando…';$('#lgm').style.color='#667085';
  try{const w=await api('/whoami');ROL=w.rol;try{localStorage.setItem('pdc.clave',v);localStorage.setItem('pdc.email',em);}catch(e){}
    document.getElementById('login').remove();await loadAll();}
  catch(e){CLAVE=null;$('#lgm').style.color='#C0392B';$('#lgm').textContent=e.status===401?'Email o clave incorrectos (o tu email no está habilitado).':'No se pudo conectar: '+e.message;}}
function logout(){try{localStorage.removeItem('pdc.clave');}catch(e){}location.reload();}
async function loadAll(){
  $('#view').innerHTML='<div class="card"><p class="mut">Cargando datos de la base compartida…</p></div>';
  try{const d=new Date();d.setDate(d.getDate()-150);
    const [b,r]=await Promise.all([api('/bootstrap'),api('/registros?desde='+d.toISOString().slice(0,10))]);
    DB=fresh();DB.demoLoaded=false;mapBoot(b);mapRegs(r);snapAll();
    UI.rf.fecha=lastDate();UI.fecha=today();UI.turno=nowTurno();render();
  }catch(e){if(e.status===401){logout();return;}$('#view').innerHTML='<div class="card"><h3>No se pudo cargar</h3><p>'+esc(e.message)+'</p><button class="btn nv" onclick="location.reload()">Reintentar</button></div>';}}
async function startServer(){
  DB=fresh();DB.demoLoaded=false;renderTabs();
  try{CLAVE=localStorage.getItem('pdc.clave');EMAIL=localStorage.getItem('pdc.email');}catch(e){}
  if(!CLAVE||!EMAIL){showLogin();return;}
  try{const w=await api('/whoami');ROL=w.rol;await loadAll();}
  catch(e){if(e.status===401){try{localStorage.removeItem('pdc.clave');}catch(_){}CLAVE=null;showLogin('La clave guardada ya no es válida.');}
    else $('#view').innerHTML='<div class="card"><h3>Sin conexión con la base</h3><p>'+esc(e.message)+'</p><button class="btn nv" onclick="location.reload()">Reintentar</button></div>';}}

/* ===================== INICIO ===================== */
if(SERVER){startServer();}
else{
DB=loadDB();if(!DB||!DB.v){DB=fresh();loadDemo();save();}
UI.rf.fecha=lastDate();UI.fecha=today();UI.turno=nowTurno();
render();
}
</script>
